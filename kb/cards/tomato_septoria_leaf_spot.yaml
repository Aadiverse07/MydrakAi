id: tomato_septoria_leaf_spot
crop: tomato
names:
  en: Septoria leaf spot (tomato)
  hi: टमाटर की सेप्टोरिया पत्ती धब्बा बीमारी
symptoms:
- Numerous small, grey, circular leaf spots with a dark border
- The plant may be attacked at any stage of growth
confusable_with: []
follow_up_questions:
- id: spot_look
  en: Are the spots small, grey and round with a darker border?
  hi: क्या धब्बे छोटे, गोल और धूसर (स्लेटी) हैं जिनका किनारा गहरा है?
- id: many_spots
  en: Are there very many spots on the leaves?
  hi: क्या पत्तियों पर बहुत ज़्यादा संख्या में धब्बे हैं?
low_risk_steps:
  en:
  - Remove and destroy the affected plant parts.
  hi:
  - प्रभावित पौधे के हिस्सों को हटाकर नष्ट करें।
chemical_options: []
