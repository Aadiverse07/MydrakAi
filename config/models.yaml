# UNVERIFIED until a smoke test passes.
tier1:
  name: "tier-1 cheap diagnosis model (Muse Glimmer 30B, hosted)"
  model_id: "meta-models/Muse-Glimmer-30B"
  endpoint: "https://api.together.xyz/v1"
  price_input_per_1m: 0.35
  price_output_per_1m: 1.50
  timeout_s: 30
  max_tokens: 512                      # Max output tokens
  max_input_tokens_estimate: 4000      # NEW: Bounds input cost (covers text + image)
  samples_per_case: 2
tier2:
  name: "tier-2 strong reasoning model"
  model_id: "muse-spark-1.3"
  model_id_contributor: "muse-spark-1.3-contributor"
  endpoint: "https://api.meta.ai/v1"
  price_input_per_1m: 1.25
  price_output_per_1m: 4.25
  timeout_s: 30
  max_tokens: 2048                     # Max output tokens
  diagnosis_max_tokens: 512            # Project-local conservative JSON diagnosis bound
  max_input_tokens_estimate: 4000      # NEW: Bounds input cost
  max_calls_per_case: 1
sam:
  name: "segmentation model"
  model_id: "sam-3.1"
  endpoint: "https://api.meta.ai/v1"
  price_per_1k_images: 2.50
  timeout_s: 30
  max_input_tokens_estimate: 2000      # NEW: Bounds any prompt text sent with the image
voice:
  name: "speech transcription model"
  model_id: "muse-voice-transcribe-1.0"
  endpoint: "https://api.meta.ai/v1"
  price_per_1k_minutes: 3.00
  timeout_s: 30
  max_input_tokens_estimate: 1000      # NEW: Bounds any context sent to the voice model
glimmer_host:
  choice: "together"
